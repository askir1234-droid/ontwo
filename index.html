<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>반응 속도 탐구 제안서 중간점검</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
body{background:#f8fafc}.card{background:white;border:1px solid #e2e8f0;border-radius:1rem}.field{width:100%;border:1px solid #cbd5e1;border-radius:.75rem;padding:.75rem 1rem}.field:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
</style>
</head>
<body class="text-slate-800">
<header class="bg-slate-950 text-white"><div class="max-w-6xl mx-auto p-6"><h1 class="text-2xl font-bold">반응 속도 탐구 제안서 중간점검</h1><p class="text-slate-400 mt-2">탐구 주제와 실험 설계를 점검하고, 가상 실험 결과를 그래프로 표현하기에 적절한지 확인해.</p></div></header>
<main class="max-w-6xl mx-auto p-5 grid xl:grid-cols-[1fr_380px] gap-6 items-start">
<div class="space-y-6">
<section class="card p-6"><h2 class="text-lg font-bold mb-1">1. 탐구 주제</h2><p class="text-sm text-slate-500 mb-5">반응 속도와 관련된 탐구 대상, 조작 변인, 종속 변인이 드러나도록 작성해.</p><input id="topic" class="field" placeholder="탐구 대상, 조작 변인, 종속 변인이 드러나도록 작성해."></section>
<div id="experiments"></div>
<section class="card p-6"><button id="feedbackButton" onclick="requestFeedback()" class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-slate-400 text-white rounded-xl py-4 font-bold flex justify-center gap-2"><i data-lucide="scan-search"></i>중간점검 결과 받기</button><p class="text-xs text-center text-slate-500 mt-3">동기·목적은 점검하지 않아. 주제·실험 설계·그래프 적합성만 확인해.</p></section>
</div>
<aside class="xl:sticky xl:top-5"><section class="card overflow-hidden"><div class="bg-slate-950 text-white p-5"><h2 class="font-bold">점검 결과</h2><p class="text-xs text-slate-400 mt-1">문제 있는 부분만 최대 5개 표시해.</p></div><div id="feedbackContainer" class="p-5"><div class="py-10 text-center text-slate-500"><i data-lucide="clipboard-list" class="mx-auto mb-3"></i>제안서를 작성한 뒤 점검 버튼을 눌러봐.</div></div></section><button onclick="checkServerStatus()" class="mt-3 w-full text-sm border rounded-xl p-3 bg-white">Gemini 서버 상태 확인</button></aside>
</main>
<script>
const STORAGE_KEY='reaction_rate_proposal_v5';
const expHtml=n=>`<section class="card p-6 mt-6"><h2 class="text-lg font-bold">${n+1}. 실험 설계 ${n===1?'Ⅰ':'Ⅱ'}</h2><p class="text-sm text-slate-500 mt-1 mb-5">실제로 측정할 수 있도록 변인과 측정 방법, 실험 과정을 구체적으로 작성해.</p><div class="space-y-5">
<label class="block"><b>사용할 화학 반응</b><textarea id="e${n}reaction" class="field mt-2" rows="2" placeholder="어떤 화학 반응을 이용하는지"></textarea></label>
<label class="block"><b>반응 속도 측정 방법</b><textarea id="e${n}measurement" class="field mt-2" rows="3" placeholder="예: 앙금이 나타날 때까지 걸린 시간(s)을 초시계로 측정"></textarea></label>
<label class="block"><b>가설</b><textarea id="e${n}hypothesis" class="field mt-2" rows="3" placeholder="조작 변인과 측정 가능한 종속 변인의 인과관계가 드러나도록 작성"></textarea></label>
<div class="grid md:grid-cols-2 gap-4"><label><b>조작 변인</b><input id="e${n}independent" class="field mt-2" placeholder="농도 / 표면적 / 온도 / 촉매 중 하나"></label><label><b>종속 변인</b><input id="e${n}dependent" class="field mt-2" placeholder="실제로 측정할 값"></label></div>
<label class="block"><b>조작 변인의 구체적인 3가지 값</b><input id="e${n}values" class="field mt-2" placeholder="예: 20℃, 40℃, 60℃"></label>
<label class="block"><b>통제 변인</b><textarea id="e${n}controls" class="field mt-2" rows="3" placeholder="조작 변인 외에 일정하게 유지할 조건"></textarea></label>
<label class="block"><b>실험 과정 (3~5단계)</b><textarea id="e${n}steps" class="field mt-2" rows="7" placeholder="① ...\n② ...\n③ ...\n시약, 양·부피·농도, 기구, 온도, 측정 조건 등을 구체적으로 작성"></textarea></label>
<div class="border-t pt-5"><h3 class="font-bold text-blue-700">그래프 설계</h3><p class="text-xs text-slate-500 mt-1 mb-4">나중에 AI를 이용하여 가상 실험 결과를 바탕으로 그래프를 제작할 거야. 실험에서 측정하려는 값과 X축·Y축이 서로 알맞게 연결되어 있는지 확인해.</p><div class="grid md:grid-cols-2 gap-4"><label><b>X축</b><input id="e${n}xAxis" class="field mt-2" placeholder="예: 온도(℃) 또는 반응 시간(s)"></label><label><b>Y축</b><input id="e${n}yAxis" class="field mt-2" placeholder="예: 상대적 반응속도(1/s) 또는 기체 부피(mL)"></label></div><label class="block mt-4"><b>그래프 값 계산/해석 방법</b><textarea id="e${n}graphPlan" class="field mt-2" rows="3" placeholder="예: 색이 변할 때까지 걸린 시간 t를 측정하고 1/t를 상대적 반응속도로 사용"></textarea></label></div>
</div></section>`;
document.getElementById('experiments').innerHTML=expHtml(1)+expHtml(2);
const ids=['topic',...['1','2'].flatMap(n=>['reaction','measurement','hypothesis','independent','dependent','values','controls','steps','xAxis','yAxis','graphPlan'].map(k=>`e${n}${k}`))];
function val(id){return document.getElementById(id)?.value.trim()||''}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function experiment(n){return{reaction:val(`e${n}reaction`),measurementMethod:val(`e${n}measurement`),hypothesis:val(`e${n}hypothesis`),independentVariable:val(`e${n}independent`),dependentVariable:val(`e${n}dependent`),independentValues:val(`e${n}values`),controlVariables:val(`e${n}controls`),steps:val(`e${n}steps`),xAxis:val(`e${n}xAxis`),yAxis:val(`e${n}yAxis`),graphPlan:val(`e${n}graphPlan`)}}
function collect(){return{topic:val('topic'),experiment1:experiment(1),experiment2:experiment(2)}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(collect()))}function load(){try{const d=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(!d)return;document.getElementById('topic').value=d.topic||'';[1,2].forEach(n=>{const e=d[`experiment${n}`]||{};const map={reaction:'reaction',measurement:'measurementMethod',hypothesis:'hypothesis',independent:'independentVariable',dependent:'dependentVariable',values:'independentValues',controls:'controlVariables',steps:'steps',xAxis:'xAxis',yAxis:'yAxis',graphPlan:'graphPlan'};Object.entries(map).forEach(([id,key])=>document.getElementById(`e${n}${id}`).value=e[key]||'')})}catch{}}
function basicIssues(d){const out=[];if(!d.topic)out.push({area:'탐구 주제',problem:'탐구 주제가 작성되지 않았어.'});[1,2].forEach(n=>{const e=d[`experiment${n}`],p=`실험 ${n===1?'Ⅰ':'Ⅱ'}`;if(!e.hypothesis)out.push({area:`${p} - 가설`,problem:'가설이 실제로 비어 있어.'});if(!e.independentVariable)out.push({area:`${p} - 조작 변인`,problem:'조작 변인이 작성되지 않았어.'});if(!e.dependentVariable)out.push({area:`${p} - 종속 변인`,problem:'측정할 종속 변인이 작성되지 않았어.'});if(!e.independentValues)out.push({area:`${p} - 조작 변인 값`,problem:'조작 변인의 구체적인 3가지 값이 작성되지 않았어.'});if(!e.measurementMethod)out.push({area:`${p} - 측정 방법`,problem:'반응 속도를 어떻게 측정할지 작성되지 않았어.'});if(!e.xAxis||!e.yAxis)out.push({area:`${p} - 그래프 축`,problem:'X축과 Y축을 모두 작성해야 가상 실험 결과를 그래프로 표현할 수 있어.'})});return out.slice(0,5)}
async function requestFeedback(){const d=collect();save();const b=document.getElementById('feedbackButton');const local=basicIssues(d);if(local.length>=5){render({issues:local,aiChecked:false,notice:'먼저 명확한 미작성 항목을 채워줘.'});return}b.disabled=true;document.getElementById('feedbackContainer').innerHTML='<div class="py-12 text-center"><p class="font-bold">설계와 그래프를 점검하고 있어...</p><p class="text-sm text-slate-500 mt-2">작성된 항목을 미작성으로 판단하지 않도록 실제 입력값을 기준으로 확인해.</p></div>';try{const c=new AbortController(),t=setTimeout(()=>c.abort(),20000);const r=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({proposal:d}),signal:c.signal});clearTimeout(t);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||'점검 요청을 완료하지 못했어.');render(j.report||{})}catch(e){renderError(e.name==='AbortError'?'점검 시간이 너무 오래 걸렸어. 잠시 후 다시 시도해줘.':e.message)}finally{b.disabled=false;lucide.createIcons()}}
function render(report){const c=document.getElementById('feedbackContainer'),issues=Array.isArray(report.issues)?report.issues.slice(0,5):[];if(!issues.length){c.innerHTML=`<div class="border border-emerald-200 bg-emerald-50 rounded-xl p-5"><b class="text-emerald-900">우선 수정할 큰 문제를 찾지 못했어.</b><p class="text-sm mt-2 text-emerald-800">${esc(report.notice||'주제·설계·그래프 연결을 다시 한 번 직접 확인해.')}</p></div>`;return}c.innerHTML=`<div class="space-y-3">${issues.map((x,i)=>`<div class="border border-amber-200 bg-amber-50 rounded-xl p-4"><div class="text-xs font-bold text-amber-700">${i+1}. ${esc(x.area||'확인 필요')}</div><p class="text-sm mt-2 leading-6">${esc(x.problem||'다시 확인해봐.')}</p></div>`).join('')}${report.notice?`<div class="text-xs bg-blue-50 border border-blue-200 rounded-xl p-3">${esc(report.notice)}</div>`:''}</div>`;lucide.createIcons()}
function renderError(m){document.getElementById('feedbackContainer').innerHTML=`<div class="border border-red-200 bg-red-50 rounded-xl p-5"><b>점검을 완료하지 못했어.</b><p class="text-sm mt-2">${esc(m)}</p></div>`}
async function checkServerStatus(){try{const r=await fetch('/api/health',{cache:'no-store'}),j=await r.json();alert(j.ok?`서버 정상\n모델: ${j.model||'확인 불가'}`:'서버 상태를 확인해줘.')}catch{alert('서버에 연결하지 못했어.')}}
document.addEventListener('DOMContentLoaded',()=>{load();ids.forEach(id=>document.getElementById(id)?.addEventListener('input',save));lucide.createIcons()});
</script></body></html>
